services:
  kamichain:
    image: ghcr.io/joshuaisikah/kamichain:latest
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kamichain-data:/data/kamichain
    environment:
      BRIDGE_PORT: "8080"
      NODE_RPC_ADDR: "127.0.0.1:8332"
      NODE_BIND_ADDR: "127.0.0.1:8333"
      NODE_DIFFICULTY: "5"
      NODE_DATA_DIR: "/data/kamichain"
      RESET_INTERVAL_HOURS: "6"
      DEMO_TX_COOLDOWN_SECS: "20"
      FRONTEND_ORIGIN: "https://joshuaisikah.github.io"
      ADMIN_TOKEN: "${KAMICHAIN_ADMIN_TOKEN}"

volumes:
  kamichain-data:
